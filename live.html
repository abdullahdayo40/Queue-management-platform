<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>QueueOptimizer Pro - Live</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0f;color:#fff;padding:20px}
.container{max-width:700px;margin:auto}
h1{text-align:center;margin:20px 0 8px}
.sub{text-align:center;opacity:.6;margin-bottom:25px}
.card{background:#1a1a24;border:1px solid #2a2a3a;border-radius:16px;padding:20px;margin-bottom:18px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:8px 0;font-size:16px}
button{width:100%;padding:14px;border-radius:10px;border:0;background:#6c5cff;color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin-top:10px}
.item{display:flex;justify-content:space-between;padding:14px;background:#111;border-radius:10px;margin:8px 0;border:1px solid #222}
.ok{background:#00c851;padding:12px;border-radius:10px;text-align:center;margin-bottom:15px}
</style>
</head>
<body>
<div class="container">
<h1>QueueOptimizer Pro</h1>
<p class="sub">Live with Supabase</p>
<div id="status"></div>
<div class="card">
<input id="nameInput" placeholder="Enter your name">
<button id="joinBtn" onclick="joinQueue()">Join Queue</button>
</div>
<div class="card">
<h3>Live Queue (<span id="count">0</span>)</h3>
<div id="list">Loading...</div>
<button onclick="loadQueue()" style="background:#222">Refresh</button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://yqyehvdskixrldpsjyvi.supabase.co";
const SUPABASE_KEY = "sb_publishable_yEcPXsZCoWnZPjF47Q6fZA_OzPZ_t-v";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function loadQueue(){
  const listEl=document.getElementById('list');
  const statusEl=document.getElementById('status');
  listEl.innerHTML="Loading...";
  const {data,error}=await supabaseClient.from('queue').select('*').order('id',{ascending:true});
  if(error){statusEl.innerHTML=`<div style="background:red;padding:12px;border-radius:10px">Error: ${error.message}</div>`;return;}
  statusEl.innerHTML=`<div class=ok>✅ Connected - Real Database Active</div>`;
  document.getElementById('count').innerText=data.length;
  if(data.length===0){listEl.innerHTML="No one in queue. Be first!";return;}
  listEl.innerHTML=data.map((q,i)=>`<div class="item"><span><b>#${i+1}</b> ${q.name}</span><span><button onclick="removeItem(${q.id})" style="width:auto;padding:6px 12px;background:red;margin-left:8px">X</button></span></div>`).join('');
}
async function joinQueue(){
  const name=document.getElementById('nameInput').value.trim();
  if(!name)return alert("Enter name");
  const btn=document.getElementById('joinBtn');btn.disabled=true;btn.innerText="Joining...";
  const {error}=await supabaseClient.from('queue').insert([{name}]);
  btn.disabled=false;btn.innerText="Join Queue";
  if(error)alert(error.message);else{document.getElementById('nameInput').value='';loadQueue();}
}
async function removeItem(id){await supabaseClient.from('queue').delete().eq('id',id);loadQueue();}
loadQueue();
</script>
</body>
</html>
